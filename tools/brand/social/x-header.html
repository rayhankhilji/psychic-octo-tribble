<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<!-- X header, 1500 × 500. Your avatar covers the bottom-left corner, and phones trim the top
     and bottom edges: the words sit high and left of centre, clear of both. -->
<style>
  .copy { position: absolute; left: 72px; top: 92px; width: 560px; display: grid; gap: 16px; }
  .copy h1 { font-size: 58px; }
  .copy .sub { font-size: 21px; }
</style></head>
<body><div class="frame">
  <div class="city" style="background-image: url({{city}})"></div>
  <div class="layer paper-left"></div>
  <div class="vignette"></div>
  <div class="copy">
    <h1>Your MRR builds a tiny San&nbsp;Francisco.</h1>
    <p class="sub">A Tamagotchi for your startup, run on your real Stripe numbers.</p>
  </div>
</div></body></html>
