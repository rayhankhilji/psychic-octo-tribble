<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<!-- Product Hunt gallery 1/4, 1270 × 760: the grown city by day. -->
<style>
  .copy { position: absolute; left: 64px; top: 58px; width: 500px; display: grid; gap: 22px; }
  .copy h1 { margin-top: 18px; }
  .foot { position: absolute; left: 64px; bottom: 44px; }
</style></head>
<body><div class="frame">
  <div class="city" style="background-image: url({{city}})"></div>
  <div class="layer paper-left"></div>
  <div class="vignette"></div>
  <div class="copy">
    <img class="lockup" src="logo-horizontal-light.svg" alt="TinyTown">
    <h1>A Tamagotchi for your startup.</h1>
    <p class="sub">Connect Stripe and GitHub. Your real MRR, customers and releases build a tiny San Francisco.</p>
  </div>
  <div class="foot"><span class="caption"><img src="mark.svg" alt="">Nightjar, a demo startup <i>/</i> day {{day}} <i>/</i> <b>{{mrr}}</b> MRR</span></div>
</div></body></html>
