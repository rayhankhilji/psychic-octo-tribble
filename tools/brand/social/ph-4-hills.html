<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<!-- Product Hunt gallery 4/4, 1270 × 760: TinyTown Hills, the sign and the founder's house. -->
<style>
  /* A narrower sheet of paper than the others, so the whole sign stays clear on the right. */
  .paper-left { background: linear-gradient(90deg, rgba(246, 238, 223, 0.98) 0%, rgba(246, 238, 223, 0.95) 38%, rgba(246, 238, 223, 0.55) 45%, rgba(246, 238, 223, 0) 52%); }
  .copy { position: absolute; left: 64px; top: 64px; width: 440px; display: grid; gap: 20px; }
  .foot { position: absolute; left: 64px; bottom: 44px; }
</style></head>
<body><div class="frame">
  <div class="city" style="background-image: url({{city}})"></div>
  <div class="layer paper-left"></div>
  <div class="vignette"></div>
  <div class="copy">
    <p class="eyebrow">Your house</p>
    <h1>From a hacker house to a house on the&nbsp;moon.</h1>
    <p class="sub">Your own home moves up a rung with every extra digit of MRR.</p>
  </div>
  <div class="foot"><span class="caption"><img src="mark.svg" alt="">TinyTown Hills <i>/</i> Nightjar, a demo startup <i>/</i> <b>{{mrr}}</b> MRR</span></div>
</div></body></html>
