<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<!-- LinkedIn banner, 1584 × 396. The profile photo covers the left: the words sit right. -->
<style>
  .copy { position: absolute; right: 72px; top: 50%; transform: translateY(-50%); width: 560px; display: grid; gap: 16px; }
  .copy .lockup { height: 40px; margin-bottom: 8px; }
  .copy h1 { font-size: 50px; }
  .copy .sub { font-size: 20px; }
</style></head>
<body><div class="frame">
  <div class="city" style="background-image: url({{city}})"></div>
  <div class="layer paper-right"></div>
  <div class="vignette"></div>
  <div class="copy">
    <img class="lockup" src="logo-horizontal-light.svg" alt="TinyTown">
    <h1>A Tamagotchi for your startup.</h1>
    <p class="sub">Your real MRR, customers and releases build a tiny San&nbsp;Francisco.</p>
  </div>
</div></body></html>
