<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<!-- Product Hunt gallery 3/4, 1270 × 760: the city at night. -->
<style>
  body { background: var(--night); }
  .copy { position: absolute; left: 64px; top: 64px; width: 500px; display: grid; gap: 20px; }
  .foot { position: absolute; left: 64px; bottom: 44px; }
</style></head>
<body class="night"><div class="frame">
  <div class="city" style="background-image: url({{city}})"></div>
  <div class="layer paper-left"></div>
  <div class="vignette"></div>
  <div class="copy">
    <p class="eyebrow">Day and night</p>
    <h1>It keeps your hours.</h1>
    <p class="sub">The city follows your local clock and your real numbers. Fall short on upkeep and the TINYTOWN sign is the first light to go out.</p>
  </div>
  <div class="foot"><span class="caption"><img src="mark.svg" alt="">Nightjar, a demo startup <i>/</i> 10 pm <i>/</i> <b>{{customers}}</b> customers</span></div>
</div></body></html>
