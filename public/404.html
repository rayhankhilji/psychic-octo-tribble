<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · TinyTown</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5ecdb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1424" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Geist+Mono:wght@400..600&family=Geist:wght@400..700&display=swap" rel="stylesheet" />
    <style>
      /* Self-contained (it can be served at any path), in the boot screen's palette and motion.
         CSS only: the mark builds itself as it does on the boot screen, the words come up,
         the skyline draws on from the water, the sun rises from behind Twin Peaks, and last
         the empty lot is pegged out where the missing page would stand. All of it is over
         in about a second; the button is usable from the first frame. */
      :root {
        --bg: #f5ecdb;
        --ink: #1b2236;
        --ink-2: #4b5168;
        --ink-3: #62667a;
        --city: #1b2236;
        --gate: #e5512b;
        --code: #a83818;
        --sun: #f6b53d;
        --water: #2c6fb7;
        --fill: #cc4420;
        --fill-hover: #b93d1c;
        --focus: #2c6fb7;
        --glow: radial-gradient(120% 80% at 50% 0%, #fbf5ea 0%, #f5ecdb 55%, #ecdfc6 100%);
        --shadow: rgba(27, 34, 54, 0.16);
        --out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1424;
          --ink: #f6eedf;
          --ink-2: #c8c2b6;
          --ink-3: #9a98a7;
          --city: #c8c2b6;
          --gate: #ff6a3d;
          --code: #ff8a62;
          --sun: #f6cf7d;
          --water: #78b2ef;
          --focus: #78b2ef;
          --glow: radial-gradient(120% 80% at 50% 0%, #1a2136 0%, #0f1424 60%, #0b0f1c 100%);
          --shadow: rgba(0, 0, 0, 0.45);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 32px 16px;
        background: var(--bg);
        background-image: var(--glow);
        color: var(--ink);
        font: 400 16px/1.6 Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main { display: grid; justify-items: center; max-width: 460px; }
      .home { display: block; border-radius: 16px; }
      .mark { display: block; width: 76px; height: 76px; overflow: visible; filter: drop-shadow(0 14px 14px var(--shadow)); }
      .code { margin: 22px 0 0; color: var(--code); font: 500 12.5px/1 'Geist Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.08em; }
      h1 { margin: 10px 0 0; font: 800 clamp(32px, 8vw, 44px)/1.05 'Bricolage Grotesque', Geist, system-ui, sans-serif; font-stretch: 88%; letter-spacing: -0.035em; text-wrap: balance; }
      p.why { margin: 14px 0 0; color: var(--ink-2); font-size: 17px; text-wrap: pretty; }
      .skyline { width: min(320px, 82vw); height: auto; margin-top: 30px; overflow: visible; }
      .skyline path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .skyline .city { stroke: var(--city); stroke-width: 1.4; }
      .skyline .bridge { stroke: var(--gate); stroke-width: 1.6; }
      .skyline .sun { stroke: var(--sun); stroke-width: 1.6; }
      .skyline .moon { fill: var(--sun); stroke: none; display: none; }
      .skyline .water { stroke: var(--water); stroke-width: 1.2; opacity: 0.6; }
      /* The empty lot: dashed, where the missing page would stand. */
      .skyline .lot { stroke: var(--gate); stroke-width: 1.2; stroke-dasharray: 2.5 3; }
      @media (prefers-color-scheme: dark) {
        .skyline .sun { display: none; }
        .skyline .moon { display: inline; }
      }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; align-items: center; margin-top: 30px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--fill); color: #fff; font-weight: 560; font-size: 15px; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 1px 1px rgba(27, 34, 54, 0.06), 0 4px 10px -4px rgba(27, 34, 54, 0.3); transition: background 120ms, transform 120ms var(--out); }
      .btn:hover { background: var(--fill-hover); }
      .btn:active { transform: translateY(1px); }
      .btn svg { width: 15px; height: 15px; transition: transform 200ms var(--out); }
      .btn:hover svg { transform: translateX(2px); }
      .quiet { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink-3); font-size: 15px; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
      .quiet:hover { color: var(--ink); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
      .home:focus-visible { border-radius: 16px; }

      /* ── Motion ──────────────────────────────────────────────────────────── */
      /* The mark builds as on the boot screen: tile, tower, block, then the sun. */
      .mark .mk { transform-box: view-box; transform-origin: 24px 46px; animation: rise 560ms var(--spring) both; }
      .mark .mk-0 { animation: settle 420ms var(--out) both; }
      .mark .mk-1 { animation-delay: 120ms; }
      .mark .mk-2 { animation-delay: 200ms; }
      .mark .mk-3 { animation: sun-in 640ms var(--out) 300ms both; }
      /* The words come up in reading order, 60ms apart. */
      .code, h1, p.why, .actions { animation: up 560ms var(--out) both; }
      .code { animation-delay: 80ms; }
      h1 { animation-delay: 140ms; }
      p.why { animation-delay: 200ms; }
      .actions { animation-delay: 260ms; }
      /* The skyline: the water first, then the bridge and the city draw on from it. */
      .skyline .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 760ms var(--in-out) both; }
      .skyline .water.draw { animation-duration: 520ms; animation-delay: 180ms; }
      .skyline .bridge.draw { animation-delay: 300ms; }
      .skyline .city.draw { animation-delay: 360ms; }
      /* The sun comes up from behind the hills (clipped to the sky above them). */
      .skyline .rise { animation: sunrise 720ms var(--out) 720ms both; }
      /* Last, the lot is pegged out. */
      .skyline .lot { transform-box: fill-box; transform-origin: 50% 100%; animation: peg 420ms var(--spring) 980ms both; }

      @keyframes rise { from { opacity: 0; transform: translateY(10px) scaleY(0.2); } }
      @keyframes settle { from { opacity: 0; transform: translateY(6px); } }
      @keyframes sun-in { from { opacity: 0; transform: translate(-6px, 8px) scale(0.4); } }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes sunrise { from { opacity: 0; transform: translateY(20px); } 40% { opacity: 1; } }
      @keyframes peg { from { opacity: 0; transform: scaleY(0.3); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
        .skyline .draw { stroke-dashoffset: 0; }
      }
    </style>
  </head>

b7"/><path class="mk mk-2" d="M24.2 31.7L31.43 35.87L24 40.16L16.77 35.99Z" fill="#5fae5a"/><path class="mk mk-2" d="M21.4 32.8a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0Z" fill="#3f8a49"/></svg></a>
