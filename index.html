    <style>
      /* Boot screen: inline so it paints before any script loads. */
      html, body { margin: 0; height: 100%; background: #f5ecdb; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, #fbf5ea 0%, #f5ecdb 55%, #ecdfc6 100%); color: #1b2236; font-family: Geist, system-ui, sans-serif; transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.7s; }
      .boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot.done .boot-inner { transform: translateY(-10px) scale(0.985); }
      .boot-inner { display: grid; justify-items: center; text-align: center; padding: 24px; transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .boot-mark { width: 92px; height: 92px; overflow: visible; filter: drop-shadow(0 18px 18px rgba(27, 34, 54, 0.14)); }
      .boot-mark .mk { transform-box: view-box; transform-origin: 24px 46px; animation: boot-rise 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
      .boot-mark .mk-0 { animation: none; }
      .boot-mark .mk-1 { animation-delay: 0.25s; }
      .boot-mark .mk-2 { animation-delay: 0.4s; }
      .boot-mark .mk-3 { animation: boot-sun 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both; }
      .boot-word { margin-top: 18px; font: 800 44px/1 'Bricolage Grotesque', Geist, system-ui, sans-serif; font-stretch: 88%; letter-spacing: -0.035em; }
      .boot-tag { margin: 10px 0 0; font-size: 15px; color: #5b6075; }
      .boot-skyline { width: min(320px, 76vw); height: auto; margin-top: 26px; overflow: visible; }
      .boot-skyline path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 2.2s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards; }
      .boot-skyline .ghost { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; opacity: 0.12; }
      .boot-skyline .sky-city { stroke: #1b2236; stroke-width: 1.4; }
      .boot-skyline .sky-bridge { stroke: #e5512b; stroke-width: 1.6; animation-delay: 0.7s; }
      .boot-skyline .sky-sun { stroke: #f6b53d; stroke-width: 1.6; animation-delay: 1.6s; animation-duration: 1s; }
      .boot-skyline .sky-water { stroke: #2c6fb7; stroke-width: 1.2; stroke-dasharray: 1; opacity: 0.6; animation-delay: 1.2s; }
      .boot-bar { position: relative; width: 148px; height: 3px; margin-top: 22px; border-radius: 3px; background: rgba(27, 34, 54, 0.1); overflow: hidden; }
      .boot-bar i { position: absolute; inset: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #e5512b, transparent); animation: boot-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .boot-status { min-height: 18px; margin: 12px 0 0; font-size: 12.5px; color: #62667a; font-variant-numeric: tabular-nums; }
      .boot.failed .boot-bar { display: none; }
      .boot.failed .boot-status { color: #b83c1c; max-width: 360px; font-size: 14px; }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(10px) scaleY(0.2); } }
      @keyframes boot-sun { from { opacity: 0; transform: translate(-6px, 8px) scale(0.4); } }
      @keyframes boot-fade { from { opacity: 0; transform: translateY(6px); } }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot *, .boot { animation: none !important; transition-duration: 0.01s !important; }
        .boot-skyline path { stroke-dashoffset: 0; }
      }
    </style>
